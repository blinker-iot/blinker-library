name: Device V2 quality gates

on:
  push:
    branches: [device_v2]
    paths:
      - ".github/workflows/device-v2-ci.yml"
      - ".github/workflows/device-v2-cloud-beta.yml"
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "library.json"
      - "keywords.txt"
      - "README.md"
      - "release/**"
      - "profiles/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/device-v2-ci.yml"
      - ".github/workflows/device-v2-cloud-beta.yml"
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "library.json"
      - "keywords.txt"
      - "README.md"
      - "release/**"
      - "profiles/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install pinned TypeScript oracle
        run: npm install --global typescript@4.3.5
      - name: Architecture boundary
        run: python3 tests/architecture/check_device_v2.py
      - name: Python syntax boundary
        run: python3 -m compileall -q tools tests
      - name: Task resource evidence parser (no SDK or hardware)
        run: python3 -m unittest discover -s tests/arduino -p 'test_task_resource_gate.py'
      - name: Task NVS fixture driver (no hardware)
        run: python3 -m unittest discover -s tests/hardware -p 'test_task_nvs_gate.py'
      - name: Task grant independent signature oracle
        run: node tests/golden/task_management_grant_oracle.cjs tests/golden/task_management_grant_vectors.properties
      - name: Gateway hardware-tool self-tests (no hardware)
        run: node --test tests/hardware/*.test.mjs tests/hardware/*.test.cjs
      - name: ASan, UBSan, LSan and deterministic fuzz
        run: >-
          python3 tests/host/run_sanitized_tests.py
          --mode asan-ubsan
          --iterations 200000
          --build-dir build/sanitized
      - name: Cross-language exact golden vectors
        shell: pwsh
        run: |
          ./tests/golden/run_cross_language_golden.ps1 `
            -CppExecutable "$PWD/build/sanitized/blinker_device_v2_golden_tests" `
            -NoiseCppExecutable "$PWD/build/sanitized/blinker_noise_golden_tests" `
            -ControllerAuthCppExecutable "$PWD/build/sanitized/blinker_controller_auth_golden_tests" `
            -ControllerControlCppExecutable "$PWD/build/sanitized/blinker_controller_control_golden_tests" `
            -BleEnrollmentCppExecutable "$PWD/build/sanitized/blinker_ble_enrollment_golden_tests" `
            -DeviceKeySessionCppExecutable "$PWD/build/sanitized/blinker_device_key_session_golden_tests" `
            -DirectSecureCppExecutable "$PWD/build/sanitized/blinker_direct_secure_golden_tests" `
            -TypeScriptCompiler (Get-Command tsc).Source

  libfuzzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Restore evolving protocol corpus
        uses: actions/cache@v4
        with:
          path: build/fuzz-corpus
          key: bbp2-libfuzzer-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bbp2-libfuzzer-${{ runner.os }}-
      - name: Configure Clang libFuzzer with sanitizers
        run: >-
          cmake -S tests/host -B build/libfuzzer
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DBLINKER_ENABLE_ASAN=ON
          -DBLINKER_ENABLE_UBSAN=ON
          -DBLINKER_USE_LIBFUZZER=ON
      - name: Build libFuzzer target
        run: >-
          cmake --build build/libfuzzer
          --target blinker_device_v2_protocol_fuzz
          --parallel 2
      - name: Seed and evolve corpus
        run: |
          python3 tests/host/seed_fuzz_corpus.py build/fuzz-corpus
          mkdir -p build/fuzz-artifacts
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          ./build/libfuzzer/blinker_device_v2_protocol_fuzz \
            build/fuzz-corpus \
            -max_total_time=60 \
            -timeout=5 \
            -rss_limit_mb=2048 \
            -artifact_prefix=build/fuzz-artifacts/
      - name: Upload minimized failure inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bbp2-libfuzzer-failure
          path: |
            build/fuzz-artifacts
            build/fuzz-corpus

  package-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate the single Arduino release boundary
        run: |
          python3 tools/build_arduino_release.py --check-only
          python3 tests/release/check_release_profile.py
          python3 -m unittest discover -s tests/release -p 'test_*.py'
      - name: Build the single deterministic Arduino archive twice
        run: |
          python3 tools/build_arduino_release.py \
            --stage-dir build/release-a/library \
            --output-dir build/release-a/artifacts \
            --profile tests/release/development_profile.json \
            --allow-development-profile
          python3 tools/build_arduino_release.py \
            --stage-dir build/release-b/library \
            --output-dir build/release-b/artifacts \
            --profile tests/release/development_profile.json \
            --allow-development-profile
          cmp \
            build/release-a/artifacts/BlinkerDeviceV2-*.zip \
            build/release-b/artifacts/BlinkerDeviceV2-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blinker-device-v2-arduino-development
          path: build/release-a/artifacts

  # Same-commit candidate delivery for device_v2; no default-branch write or secrets.
  cloud-beta-candidate:
    needs: [host-quality, package-boundary]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/device_v2' }}
    uses: ./.github/workflows/device-v2-cloud-beta.yml
    with:
      verify_location_input: true

  arduino-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32-core
            core: esp32:esp32@3.3.6
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - target: uno-r4-core
            core: arduino:renesas_uno@1.5.3
            index: ""
          - target: esp8266-core
            core: esp8266:esp8266@3.1.2
            index: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          - target: wio-terminal-core
            core: Seeeduino:samd@1.8.5
            index: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          - target: rp2040-core
            core: rp2040:rp2040@5.1.0
            index: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - target: nrf52840-core
            core: adafruit:nrf52@1.7.0
            index: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install pinned Adafruit nRF Linux packaging tool
        if: matrix.target == 'nrf52840-core'
        run: |
          python3 -m venv "${RUNNER_TEMP}/adafruit-nrfutil"
          "${RUNNER_TEMP}/adafruit-nrfutil/bin/pip" install \
            adafruit-nrfutil==0.5.3.post16
          echo "${RUNNER_TEMP}/adafruit-nrfutil/bin" >> "${GITHUB_PATH}"
      - name: Install pinned contributed core
        if: matrix.index != ''
        run: >-
          arduino-cli core install "${{ matrix.core }}"
          --additional-urls "${{ matrix.index }}"
      - name: Install pinned Arduino core
        if: matrix.index == ''
        run: arduino-cli core install "${{ matrix.core }}"
      - name: Install pinned portable crypto fallback
        run: arduino-cli lib install "Crypto@0.4.0"
      - name: Compile portable Core/BBP2 and crypto fallback
        run: >-
          python3 tests/arduino/compile_matrix.py
          --target "${{ matrix.target }}"
          --target "${{ matrix.target }}-crypto"

  arduino-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: esp32
            core: esp32:esp32@3.3.6
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            targets: --target esp32-storage --target esp32-crypto --target esp32-http --target esp32-mqtt --target esp32-mqtt-tls
          - platform: uno-r4
            core: arduino:renesas_uno@1.5.3
            index: ""
            targets: --target uno-r4-storage --target uno-r4-http --target uno-r4-mqtt --target uno-r4-mqtt-tls
          - platform: esp8266
            core: esp8266:esp8266@3.1.2
            index: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            targets: --target esp8266-http --target esp8266-mqtt --target esp8266-mqtt-tls
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install pinned contributed core
        if: matrix.index != ''
        run: >-
          arduino-cli core install "${{ matrix.core }}"
          --additional-urls "${{ matrix.index }}"
      - name: Install pinned Arduino core
        if: matrix.index == ''
        run: arduino-cli core install "${{ matrix.core }}"
      - name: Install PubSubClient port dependency
        run: arduino-cli lib install "PubSubClient@2.8"
      - name: Compile platform storage, BLE security, HTTP and MQTT Ports
        run: python3 tests/arduino/compile_matrix.py ${{ matrix.targets }}

  arduino-unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Initialize isolated Arduino directories
        shell: bash
        run: |
          printf 'ARDUINO_DIRECTORIES_DATA=%s\n' "$RUNNER_TEMP/arduino-unified-data" >> "$GITHUB_ENV"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install pinned ESP32 core
        run: >-
          arduino-cli core install "esp32:esp32@3.3.6"
          --additional-urls
          "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
      - name: Install pinned UNO R4 core
        run: arduino-cli core install "arduino:renesas_uno@1.5.3"
      - name: Install pinned Wio Terminal core
        run: >-
          arduino-cli core install "Seeeduino:samd@1.8.5"
          --additional-urls
          "https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json"
      - name: Compile ESP32, UNO R4 and Wio Small SizeProbe gates
        run: python3 tests/arduino/compile_matrix.py --group size-probes
      - name: Install pinned Wio BLE preview dependencies
        run: >-
          arduino-cli lib install
          "Crypto@0.4.0"
          "Seeed Arduino rpcBLE@1.0.0"
          "Seeed Arduino rpcUnified@2.1.4"
      - name: Compile Wio BLE preview and hardware release gate
        run: python3 tests/arduino/compile_matrix.py --group previews
      - name: Build the public Arduino ZIP
        run: |
          python3 tools/build_arduino_release.py \
            --stage-dir build/formal-release/library \
            --output-dir build/formal-release/artifacts \
            --profile tests/release/development_profile.json \
            --allow-development-profile
      - name: Install the same ZIP for stock WiFi and portable targets
        run: >-
          python3 tests/arduino/verify_installed_release.py
          --zip-path build/formal-release/artifacts/BlinkerDeviceV2-0.1.0.zip
          --work-dir build/installed-zip-gate
          --target esp32-wifi --target esp32-cloud-smoke
          --target uno-r4-wifi --target uno-r4-ble --target wio-terminal-wifi
          --jobs 4
      - name: Install the official SDK matched to the S3 BLE hardware baseline
        run: >-
          arduino-cli core install "esp32:esp32@3.3.11"
          --additional-urls
          "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
      - name: Verify the official BLE SDK configuration and binary pin
        run: python3 tests/arduino/verify_esp32_ble_sdk.py --data-dir "$ARDUINO_DIRECTORIES_DATA"
      - name: Install the same ZIP for both S3 BLE products
        run: >-
          python3 tests/arduino/verify_installed_release.py
          --zip-path build/formal-release/artifacts/BlinkerDeviceV2-0.1.0.zip
          --work-dir build/installed-zip-ble-gate
          --target esp32-ble --target esp32-wifi-ble
          --jobs 4
