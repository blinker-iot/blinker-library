name: Device V2 quality gates

on:
  push:
    branches: [device_v2]
    paths:
      - ".github/workflows/device-v2-ci.yml"
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "library.json"
      - "keywords.txt"
      - "README.md"
      - "adapters/**"
      - "integrations/**"
      - "release/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/device-v2-ci.yml"
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "library.json"
      - "keywords.txt"
      - "README.md"
      - "adapters/**"
      - "integrations/**"
      - "release/**"
      - "tools/**"
      - "docs/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install pinned TypeScript oracle
        run: npm install --global typescript@4.3.5
      - name: Install pinned Espressif NVS generator
        run: |
          python3 -m venv "${RUNNER_TEMP}/blinker-nvs"
          "${RUNNER_TEMP}/blinker-nvs/bin/pip" install \
            esp-idf-nvs-partition-gen==0.3.0
          echo "NVS_PYTHON=${RUNNER_TEMP}/blinker-nvs/bin/python" >> "${GITHUB_ENV}"
      - name: Architecture boundary
        run: python3 tests/architecture/check_device_v2.py
      - name: ASan, UBSan, LSan and deterministic fuzz
        run: >-
          python3 tests/host/run_sanitized_tests.py
          --mode asan-ubsan
          --iterations 200000
          --build-dir build/sanitized
      - name: Exact C++ records and deterministic NVS image
        run: >-
          python3 tests/pre-enrollment/verify_pre_enrollment.py
          --cpp-executable build/sanitized/blinker_pre_enrollment_cpp_vectors
          --factory-cpp-executable build/sanitized/blinker_factory_credential_installer_tests
          --nvs-python "${NVS_PYTHON}"
      - name: Cross-language exact golden vectors
        shell: pwsh
        run: |
          ./tests/golden/run_cross_language_golden.ps1 `
            -CppExecutable "$PWD/build/sanitized/blinker_device_v2_golden_tests" `
            -NoiseCppExecutable "$PWD/build/sanitized/blinker_noise_golden_tests" `
            -ControllerAuthCppExecutable "$PWD/build/sanitized/blinker_controller_auth_golden_tests" `
            -ControllerControlCppExecutable "$PWD/build/sanitized/blinker_controller_control_golden_tests" `
            -OwnershipClaimCppExecutable "$PWD/build/sanitized/blinker_ownership_claim_golden_tests" `
            -EnrollmentTicketCppExecutable "$PWD/build/sanitized/blinker_enrollment_ticket_golden_tests" `
            -LocalSetupCppExecutable "$PWD/build/sanitized/blinker_local_setup_golden_tests" `
            -CloudEnrollmentCppExecutable "$PWD/build/sanitized/blinker_cloud_credential_enrollment_golden_tests" `
            -OwnershipReleaseCppExecutable "$PWD/build/sanitized/blinker_ownership_release_golden_tests" `
            -DeviceKeySessionCppExecutable "$PWD/build/sanitized/blinker_device_key_session_golden_tests" `
            -TypeScriptCompiler (Get-Command tsc).Source

  libfuzzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Restore evolving protocol corpus
        uses: actions/cache@v4
        with:
          path: build/fuzz-corpus
          key: bbp2-libfuzzer-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bbp2-libfuzzer-${{ runner.os }}-
      - name: Configure Clang libFuzzer with sanitizers
        run: >-
          cmake -S tests/host -B build/libfuzzer
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DBLINKER_ENABLE_ASAN=ON
          -DBLINKER_ENABLE_UBSAN=ON
          -DBLINKER_USE_LIBFUZZER=ON
      - name: Build libFuzzer target
        run: >-
          cmake --build build/libfuzzer
          --target blinker_device_v2_protocol_fuzz
          --parallel 2
      - name: Seed and evolve corpus
        run: |
          python3 tests/host/seed_fuzz_corpus.py build/fuzz-corpus
          mkdir -p build/fuzz-artifacts
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          ./build/libfuzzer/blinker_device_v2_protocol_fuzz \
            build/fuzz-corpus \
            -max_total_time=60 \
            -timeout=5 \
            -rss_limit_mb=2048 \
            -artifact_prefix=build/fuzz-artifacts/
      - name: Upload minimized failure inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bbp2-libfuzzer-failure
          path: |
            build/fuzz-artifacts
            build/fuzz-corpus

  package-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate package metadata and dependency isolation
        run: python3 tools/build_device_v2_packages.py --check-only
      - name: Build deterministic standalone archives
        run: python3 tools/build_device_v2_packages.py --output-dir build/packages
      - name: Verify deterministic official aggregate package
        run: python3 tests/official-package/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: device-v2-staging-packages
          path: build/packages

  arduino-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32-core
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - target: uno-r4-core
            core: arduino:renesas_uno@1.5.3
            index: ""
          - target: esp8266-core
            core: esp8266:esp8266@3.1.2
            index: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          - target: wio-terminal-core
            core: Seeeduino:samd@1.8.5
            index: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          - target: rp2040-core
            core: rp2040:rp2040@5.1.0
            index: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - target: nrf52840-core
            core: adafruit:nrf52@1.7.0
            index: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install pinned Adafruit nRF Linux packaging tool
        if: matrix.target == 'nrf52840-core'
        run: |
          python3 -m venv "${RUNNER_TEMP}/adafruit-nrfutil"
          "${RUNNER_TEMP}/adafruit-nrfutil/bin/pip" install \
            adafruit-nrfutil==0.5.3.post16
          echo "${RUNNER_TEMP}/adafruit-nrfutil/bin" >> "${GITHUB_PATH}"
      - name: Install pinned contributed core
        if: matrix.index != ''
        run: >-
          arduino-cli core install "${{ matrix.core }}"
          --additional-urls "${{ matrix.index }}"
      - name: Install pinned Arduino core
        if: matrix.index == ''
        run: arduino-cli core install "${{ matrix.core }}"
      - name: Install pinned portable crypto fallback
        run: arduino-cli lib install "Crypto@0.4.0"
      - name: Compile portable Core/BBP2 and crypto fallback
        run: >-
          python3 tests/arduino/compile_matrix.py
          --target "${{ matrix.target }}"
          --target "${{ matrix.target }}-example"
          --target "${{ matrix.target }}-crypto"

  arduino-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: esp32
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            targets: --target esp32-storage --target esp32-crypto --target esp32-http --target esp32-mqtt --target esp32-mqtt-tls
          - platform: uno-r4
            core: arduino:renesas_uno@1.5.3
            index: ""
            targets: --target uno-r4-storage --target uno-r4-ble-security --target uno-r4-server-verifier --target uno-r4-factory-installer --target uno-r4-http --target uno-r4-mqtt --target uno-r4-mqtt-tls
          - platform: esp8266
            core: esp8266:esp8266@3.1.2
            index: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            targets: --target esp8266-http --target esp8266-mqtt --target esp8266-mqtt-tls
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install pinned contributed core
        if: matrix.index != ''
        run: >-
          arduino-cli core install "${{ matrix.core }}"
          --additional-urls "${{ matrix.index }}"
      - name: Install pinned Arduino core
        if: matrix.index == ''
        run: arduino-cli core install "${{ matrix.core }}"
      - name: Install PubSubClient reference adapter dependency
        run: arduino-cli lib install "PubSubClient@2.8"
      - name: Compile platform storage, BLE security, HTTP and MQTT adapters
        run: python3 tests/arduino/compile_matrix.py ${{ matrix.targets }}

  arduino-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: esp32-plain
            config: tests/official-package/package.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32
            mqtt: true
            portable_crypto: false
            nimble: false
            arduino_ble: false
            example: WiFiOnboardingQuickStart
          - profile: esp32-tls
            config: tests/official-package/package-tls.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32
            mqtt: true
            portable_crypto: false
            nimble: false
            arduino_ble: false
            example: WiFiOnboardingQuickStart
          - profile: esp32-wifi-ble-internal
            config: tests/official-package/package-esp32-wifi-ble.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
            mqtt: true
            portable_crypto: false
            nimble: true
            arduino_ble: false
            example: WifiBleCompositionProbe
          - profile: esp32-device-key-wifiprov-internal
            config: tests/official-package/package-esp32-device-key-wifiprov.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
            mqtt: true
            portable_crypto: false
            nimble: false
            arduino_ble: false
            example: Esp32ProvisionedDeviceKeyWifiCompositionProbe
          - profile: esp32-device-key-softap-nimble-internal
            config: tests/official-package/package-esp32-device-key-softap-nimble.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
            mqtt: true
            portable_crypto: false
            nimble: true
            arduino_ble: false
            example: Esp32SoftApProvisionedDeviceKeyWifiBleCompositionProbe
          - profile: esp32-device-key-wifiprov-tls-internal
            config: tests/official-package/package-esp32-device-key-wifiprov-tls.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
            mqtt: true
            portable_crypto: false
            nimble: false
            arduino_ble: false
            example: Esp32ProvisionedDeviceKeyWifiCompositionProbe
          - profile: esp32-device-key-softap-nimble-tls-internal
            config: tests/official-package/package-esp32-device-key-softap-nimble-tls.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
            mqtt: true
            portable_crypto: false
            nimble: true
            arduino_ble: false
            example: Esp32SoftApProvisionedDeviceKeyWifiBleCompositionProbe
          - profile: esp32-platform-ble-internal
            config: tests/official-package/package-esp32-platform-ble.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32
            mqtt: false
            portable_crypto: false
            nimble: true
            arduino_ble: false
            example: Esp32PlatformBleCompositionProbe
          - profile: esp32-local-ble-internal
            config: tests/official-package/package-esp32-local-ble.json
            core: esp32:esp32@3.3.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            fqbn: esp32:esp32:esp32
            mqtt: false
            portable_crypto: false
            nimble: true
            arduino_ble: false
            example: Esp32LocalBleCompositionProbe
          - profile: uno-r4-plain
            config: tests/official-package/package-uno-r4.json
            core: arduino:renesas_uno@1.5.3
            index: ""
            fqbn: arduino:renesas_uno:unor4wifi
            mqtt: true
            portable_crypto: true
            nimble: false
            arduino_ble: false
            example: WiFiOnboardingQuickStart
          - profile: uno-r4-tls
            config: tests/official-package/package-uno-r4-tls.json
            core: arduino:renesas_uno@1.5.3
            index: ""
            fqbn: arduino:renesas_uno:unor4wifi
            mqtt: true
            portable_crypto: true
            nimble: false
            arduino_ble: false
            example: WiFiOnboardingQuickStart
          - profile: uno-r4-wifi-ble-internal
            config: tests/official-package/package-uno-r4-wifi-ble.json
            core: arduino:renesas_uno@1.5.3
            index: ""
            fqbn: arduino:renesas_uno:unor4wifi
            mqtt: true
            portable_crypto: true
            nimble: false
            arduino_ble: true
            example: UnoR4WifiBleCompositionProbe
          - profile: uno-r4-platform-ble-internal
            config: tests/official-package/package-uno-r4-platform-ble.json
            core: arduino:renesas_uno@1.5.3
            index: ""
            fqbn: arduino:renesas_uno:unor4wifi
            mqtt: false
            portable_crypto: true
            nimble: false
            arduino_ble: true
            example: UnoR4PlatformBleCompositionProbe
          - profile: uno-r4-local-ble-internal
            config: tests/official-package/package-uno-r4-local-ble.json
            core: arduino:renesas_uno@1.5.3
            index: ""
            fqbn: arduino:renesas_uno:unor4wifi
            mqtt: false
            portable_crypto: true
            nimble: false
            arduino_ble: true
            example: UnoR4LocalBleCompositionProbe
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install pinned contributed core
        if: matrix.index != ''
        run: >-
          arduino-cli core install "${{ matrix.core }}"
          --additional-urls "${{ matrix.index }}"
      - name: Install pinned Arduino core
        if: matrix.index == ''
        run: arduino-cli core install "${{ matrix.core }}"
      - name: Install pinned PubSubClient dependency
        if: matrix.mqtt
        run: arduino-cli lib install "PubSubClient@2.8"
      - name: Install pinned portable crypto dependency
        if: matrix.portable_crypto
        run: arduino-cli lib install "Crypto@0.4.0"
      - name: Install pinned NimBLE dependency
        if: matrix.nimble
        run: arduino-cli lib install "NimBLE-Arduino@2.5.0"
      - name: Install pinned ArduinoBLE dependency
        if: matrix.arduino_ble
        run: arduino-cli lib install "ArduinoBLE@2.0.2"
      - name: Stage ordinary-sketch aggregate library
        run: >-
          python3 tools/build_official_arduino_package.py
          --config "${{ matrix.config }}"
          --stage-dir "build/official-${{ matrix.profile }}/library"
      - name: Compile official composition probe
        run: >-
          arduino-cli compile
          --fqbn "${{ matrix.fqbn }}"
          --clean
          --warnings all
          --build-path "build/official-${{ matrix.profile }}/arduino"
          --library "build/official-${{ matrix.profile }}/library"
          "build/official-${{ matrix.profile }}/library/examples/${{ matrix.example }}"
      - name: Audit P6 provisioning and BLE link graph
        if: matrix.profile == 'esp32-device-key-softap-nimble-internal' || matrix.profile == 'esp32-device-key-softap-nimble-tls-internal'
        run: |
          nm_tool="$(find "${HOME}/.arduino15/packages/esp32/tools" -type f -name xtensa-esp32-elf-nm | head -n 1)"
          test -n "${nm_tool}"
          tls_arg=""
          if [ "${{ matrix.profile }}" = "esp32-device-key-softap-nimble-tls-internal" ]; then
            tls_arg="--require-tls"
          fi
          python3 tests/arduino/audit_esp32_p6_elf.py \
            --nm "${nm_tool}" \
            --elf "build/official-${{ matrix.profile }}/arduino/${{ matrix.example }}.ino.elf" \
            ${tls_arg}
